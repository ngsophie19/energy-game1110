<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>能源分類小專家</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eaf6ff;
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px;
    color:#0070d8;
    font-size:30px;
}

.subtitle{
    font-size:18px;
    color:#444;
}

#cards{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:10px;
}

.card{
    width:170px;
    background:white;
    border-radius:15px;
    box-shadow:0 4px 8px rgba(0,0,0,.2);
    padding:5px;

    touch-action:none;
    user-select:none;
}

.card img{
    width:100%;
    height:95px;
    object-fit:cover;
    border-radius:10px;
}

.card h3{
    font-size:20px;
    margin:5px;
}

.card.correct{
    box-shadow:0 0 20px limegreen;
}

.zone-container{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:10px;
}

.zone{
    width:480px;
    min-height:220px;

    border:4px dashed #888;
    border-radius:20px;

    padding:10px;
}

#renewable{
    background:#e8fff0;
}

#nonrenewable{
    background:#fff1f1;
}

.zone h2{
    margin-top:0;
    font-size:28px;
}

#message{
    font-size:28px;
    font-weight:bold;
    color:#159600;
    min-height:40px;
    margin-top:10px;
}

button{

    padding:12px 25px;
    font-size:20px;

    border:none;
    border-radius:10px;

    background:#2196f3;
    color:white;

    margin-top:10px;
}

.star{
    position:fixed;
    font-size:30px;
    animation:fall 3s linear forwards;
}

@keyframes fall{

    from{
        transform:translateY(-50px);
    }

    to{
        transform:translateY(100vh);
    }
}

</style>
</head>

<body>

<h1>⚡ 能源分類小專家 ⚡</h1>

<div class="subtitle">
把發電方式拖到正確的位置！
</div>

<div id="cards">

<div class="card"
data-type="renewable">

<img src="hydro.jpg">
<h3>水力發電</h3>

</div>

<div class="card"
data-type="renewable">

<img src="solar.jpg">
<h3>太陽能發電</h3>

</div>

<div class="card"
data-type="renewable">

<img src="wind.png">
<h3>風力發電</h3>

</div>

<div class="card"
data-type="nonrenewable">

<img src="coal.jpg">
<h3>燃煤發電</h3>

</div>

<div class="card"
data-type="nonrenewable">

<img src="gas.jpg">
<h3>天然氣發電</h3>

</div>

</div>

<div class="zone-container">

<div
class="zone"
id="renewable"
data-zone="renewable">

<h2>♻️ 可再生能源</h2>

</div>

<div
class="zone"
id="nonrenewable"
data-zone="nonrenewable">

<h2>⛽ 不可再生能源</h2>

</div>

</div>

<div id="message"></div>

<button onclick="location.reload()">
重新開始
</button>

<script>

const message =
document.getElementById("message");

let draggedCard = null;

const audioContext =
new(
window.AudioContext ||
window.webkitAudioContext
)();

function successSound(){

    const osc =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    osc.frequency.value = 800;

    osc.connect(gain);
    gain.connect(
        audioContext.destination
    );

    gain.gain.setValueAtTime(
        0.2,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime+0.3
    );

    osc.start();

    osc.stop(
        audioContext.currentTime+0.3
    );
}

function errorSound(){

    const osc =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    osc.frequency.value = 250;

    osc.connect(gain);
    gain.connect(
        audioContext.destination
    );

    gain.gain.setValueAtTime(
        0.2,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime+0.4
    );

    osc.start();

    osc.stop(
        audioContext.currentTime+0.4
    );
}

function createStars(){

    for(let i=0;i<40;i++){

        const star =
        document.createElement("div");

        star.className="star";

        star.innerHTML="⭐";

        star.style.left =
        Math.random()*100 + "vw";

        document.body.appendChild(star);

        setTimeout(()=>{
            star.remove();
        },3000);
    }
}

document
.querySelectorAll(".card")
.forEach(card=>{

    card.addEventListener(
        "pointerdown",
        startDrag
    );
});

function startDrag(e){

    draggedCard =
    e.currentTarget;

    draggedCard.setPointerCapture(
        e.pointerId
    );

    const rect =
    draggedCard.getBoundingClientRect();

    const offsetX =
    e.clientX - rect.left;

    const offsetY =
    e.clientY - rect.top;

    draggedCard.style.zIndex=999;

    function move(ev){

        draggedCard.style.position =
        "fixed";

        draggedCard.style.left =
        (ev.clientX-offsetX) + "px";

        draggedCard.style.top =
        (ev.clientY-offsetY) + "px";
    }

    function end(ev){

        document.removeEventListener(
            "pointermove",
            move
        );

        document.removeEventListener(
            "pointerup",
            end
        );

        let dropped = false;

        document
        .querySelectorAll(".zone")
        .forEach(zone=>{

            const r =
            zone.getBoundingClientRect();

            if(
                ev.clientX > r.left &&
                ev.clientX < r.right &&
                ev.clientY > r.top &&
                ev.clientY < r.bottom
            ){

                zone.appendChild(
                    draggedCard
                );

                draggedCard.style.position =
                "relative";

                draggedCard.style.left = "";
                draggedCard.style.top = "";
                draggedCard.style.zIndex = "";

                dropped=true;

                if(
                    draggedCard.dataset.type
                    ===
                    zone.dataset.zone
                ){

                    successSound();

                    message.innerHTML =
                    "😊 做得好！";

                    draggedCard.classList.add(
                        "correct"
                    );
                }
                else{

                    errorSound();

                    message.innerHTML =
                    "🤔 再試一次！";
                }

                checkFinished();
            }
        });

        if(!dropped){

            draggedCard.style.position =
            "relative";

            draggedCard.style.left="";
            draggedCard.style.top="";
            draggedCard.style.zIndex="";
        }
    }

    document.addEventListener(
        "pointermove",
        move
    );

    document.addEventListener(
        "pointerup",
        end
    );
}

function checkFinished(){

    let total=0;
    let correct=0;

    document
    .querySelectorAll(".card")
    .forEach(card=>{

        if(
            card.parentElement
            .classList.contains("zone")
        ){

            total++;

            if(
                card.dataset.type
                ===
                card.parentElement.dataset.zone
            ){

                correct++;
            }
        }
    });

    if(
        total===5 &&
        correct===5
    ){

        message.innerHTML =
        "🏆 你是能源小專家！";

        createStars();

        successSound();

        setTimeout(successSound,300);
        setTimeout(successSound,600);
    }
}

</script>

</body>
</html>
